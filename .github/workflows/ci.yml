name: CI

on:
  push:
    branches: [main]
  pull_request:

# C16.2 (AUDIT-4 S-3): the token is read-only for every job; the artifact upload does not need more.
permissions:
  contents: read

jobs:
  test:
    # round 146: a stuck job (macOS Node 18, 45 minutes) must not run for GitHub's default 6 hours
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node scripts/check-manifest.mjs
      - run: node scripts/bump-round.mjs --verify
      - run: npm run smoke

  # M14, C14.4 (D99): the whole chicla-zip suite (and since C14.6 the chicla-kit suite, a second step) and the independent readers on Windows, Node 18, 20 and 22. Separate job. BLOCKING since round 161 (D115, flipping
  # D99): it was green on Node 18, 20 and 22 in two logs in a row, so a red here now turns the run red. Declared supported: chicla-zip only (D114).
  # `shell: bash` (Git for Windows) expands the glob the same way on every Node version. The readers are CHECKED first: a skipped reader proves nothing.
  windows:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: 7-Zip on PATH (installed on the runner, not on PATH)
        run: echo "C:\Program Files\7-Zip" >> "$GITHUB_PATH"
      - name: python3 (the tests call python3, the runner has python)
        run: |
          d=$(dirname "$(command -v python)")
          [ -e "$d/python3.exe" ] || cp "$d/python.exe" "$d/python3.exe"
      - name: The independent readers are there (a skipped reader is not a pass)
        run: |
          7z --help > /dev/null
          python3 -c "import zipfile; print('python zipfile ok')"
          (unzip -v | head -n 1) || echo "no unzip on this runner (not required)"
      - run: node --test packages/chicla-zip/test/*.test.mjs
      # C14.6 (D109): the chicla-kit suite, blocking like the whole job (D115). Its own step, always run, so a red chicla-zip never hides it; chicla-kit is still NOT declared supported on Windows (D114).
      - name: chicla-kit suite (C14.6)
        if: always()
        timeout-minutes: 8
        run: node --test packages/chicla-kit/test/*.test.mjs

  # C5.4: performance budget (D15): extractZip of 20 000 small files must stay within 3x `unzip`. Separate job, Linux and
  # tmpfs only (where the budget was measured; the ratio is relative, so a slower runner does not move it much).
  bench:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      TMPDIR: /dev/shm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node packages/chicla-zip/bench/small-files.mjs --runs 5 --budget 3

  # C22.2, C23.2, C23.3 (D147, D148): the `pack` and `pack-kit` jobs are gone (the two folders are private since C23.3; pack-release refuses them). Build the single package `chicla` (kit + zip module, no dependencies), pack it; a tarball, never published.
  pack-chicla:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/build-chicla.mjs --out stage
      - run: node scripts/pack-release.mjs stage/chicla --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chicla-tarball
          path: dist/

  # C24.3 (AUDIT-8 F-4, M24): install the packed `chicla` tarball ALONE (offline, empty folder) and drive init, bump-round --verify, make-delivery, verify-delivery,
  # dump (with RECOVER/), recovery and chicla-zip, on Ubuntu, macOS and Windows. The script builds and packs by itself. Windows is REPORTED, not promised (D114): its leg
  # may be red without turning the run red; read it, do not trust it.
  tarball:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/smoke-test-tarball.mjs
